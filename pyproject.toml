[project]
name = "vingo-agent"
version = "0.1.0"
description = "Trợ lý chat mua vé và quản trị Vingo (thiết kế V2.2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-ai==2.74.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6",
    "respx>=0.23.1",
    "ruff>=0.14",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: cần Docker (Testcontainers Postgres 18)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
