name: ci

# Chạy trên PR. main và develop bắt buộc qua PR có check `verify` xanh (ruleset).
# Runner AWS tự host (ip-172-31-42-161-vingo-agent, cùng máy với runner backend/web).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, aws]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Runner tự host giữ cache uv ở ~/.cache/uv giữa các lượt; không dùng cache của GitHub.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Unit test
        run: uv run pytest tests/unit -m "not eval"
      # Testcontainers dùng Docker của máy runner (image postgres:18 được giữ lại giữa các lượt).
      - name: Integration test
        run: uv run pytest tests/integration -m "not eval"
      # Chưa có release contract-v*; tạm đối chiếu với nhánh develop của vingo-backend.
      # Khi có tag, ghim bằng file CONTRACT_VERSION và tải asset từ release.
      - uses: actions/checkout@v4
        with:
          repository: TNTD-dev/vingo-backend
          ref: develop
          path: .backend
          sparse-checkout: contracts/vingo-openapi.yaml
          sparse-checkout-cone-mode: false
      - name: Operation agent dùng khớp contract backend
        run: uv run python scripts/sync_contract.py .backend/contracts/vingo-openapi.yaml
