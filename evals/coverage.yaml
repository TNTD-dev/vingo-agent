guardrails:
  G1:
    allow:
    - tests/unit/test_api.py::test_createConversation_returns201_withAuthenticatedOwner
    deny:
    - tests/unit/test_api.py::test_createConversation_returns401_withoutServiceKey
    - tests/unit/test_turn_loop.py::test_T02_turn_rejectsWrongOwnerBeforeCreatingTurn
  G2:
    allow:
    - tests/unit/test_turn_loop.py::test_T01_turn_streamsInOrderAndSavesRedactedText
    deny:
    - tests/unit/test_turn_loop.py::test_input_rejectsInvalidText
  G3:
    allow:
    - tests/unit/test_guardrails.py::test_T01_redaction_masksPhoneEmail_keepsOrderCodeAndPrice
    deny:
    - tests/unit/test_turn_loop.py::test_T01_turn_streamsInOrderAndSavesRedactedText
  G4:
    allow:
    - tests/unit/test_guardrails.py::test_T14_validArgs_preserveUUIDAndInteger
    deny:
    - tests/unit/test_tool_contracts.py::test_registeredTool_rejectsInvalidSchema_beforeHttp
  G5:
    allow:
    - tests/unit/test_registry.py::test_buyer_has17Tools_withoutAdminTools
    deny:
    - tests/unit/test_buyer_read.py::test_buyerRead_rejectsUntrustedRef_beforeAnyHttp
  G6:
    allow:
    - tests/unit/test_backend.py::test_read_retriesTwice_withAuth
    deny:
    - tests/unit/test_backend.py::test_write_timeoutIsNotRetried_andUnsafeTargetsAreBlocked
  G7:
    allow:
    - tests/unit/test_buyer_read.py::test_getPayment_returnsOpenWithoutPaymentUrl
    deny:
    - tests/integration/test_guardrails.py::test_T06_resultValidation_precedesRefsBlocksAndPriceEvidence
  G8:
    allow:
    - tests/integration/test_actions.py::test_textConfirm_usesSharedExecutionAndBlocks
    deny:
    - tests/integration/test_actions.py::test_T08_confirmBlocksInvalidAction_withoutWrite
  G9:
    allow:
    - tests/unit/test_eval.py::test_response_acceptsVerifiedFacts
    deny:
    - tests/unit/test_turn_loop.py::test_T07_replyNotices_followStreamAndPersist
  G10:
    allow:
    - tests/unit/test_context.py::test_T12_compact_skipsBelowThreshold
    deny:
    - tests/unit/test_turn_loop.py::test_T12_turn_enforcesUsageLimits
    - tests/integration/test_guardrails.py::test_T13_secondLease_isDeniedWithoutOverwritingFirst
  G11:
    allow:
    - tests/unit/test_guardrails.py::test_G11_deniedLog_onlyForGuardrailCodes_notBackendBusinessErrors
    deny:
    - tests/unit/test_guardrails.py::test_G11_denialLogsContainOnlyCode
