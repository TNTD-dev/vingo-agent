    expected:
      tools:
      - propose_hold_seats
      business_effects: 0
      tool_args:
        propose_hold_seats:
          quantity: 2
          zone_id: '{{zone_ga}}'
      blocks:
      - type: ConfirmAction
        operation: HOLD_SEATS
        display:
          total: 500000
    judge:
      goal: Nêu đúng đề xuất, hướng dẫn xác nhận
  - message: Ok nhưng khoan.
    visible_action: latest
    expected:
      tools: []
      business_effects: 0
      tools_not:
      - confirm_pending_action
    judge:
      goal: Hỏi lại, không giữ vé
